<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savory Score</title>
    <link rel="stylesheet" href="reg.css">
</head>

<body>
    <div class="regMain">
        <div class="regForm">
            <form id="loginForm">
                <input type="text" name="email" placeholder="Enter your Email ID" required>
                <input type="password" name="password" placeholder="Enter your Password" required>
                <button type="submit" id="loginBtn">Login</button>
            </form>

            <div id="loginMsg"></div>

            <script>
                // document.getElementById("loginForm").addEventListener("submit", async (e) => {
                //     e.preventDefault(); // Prevent form from reloading the page

                document.getElementById("loginBtn").addEventListener("click", loginUser);

                const data = Object.fromEntries(new FormData(e.target).entries());

                const res = await fetch("http://localhost:3000/login", { // Make sure port matches your server
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });

                const result = await res.json();
                const msgDiv = document.getElementById("loginMsg");

                if (res.ok) {
                    msgDiv.textContent = result.message; // Optional: show "Login successful"
                    msgDiv.style.color = "green";

                    // Redirect to home page after 1 second
                    setTimeout(() => {
                        window.location.href = "home.html"; // Replace with your actual home page
                    }, 1000);
                } else {
                    msgDiv.textContent = result.message; // Show error (wrong password or user not found)
                    msgDiv.style.color = "red";
                }

            </script>

</body>


</html>
