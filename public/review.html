<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write a Review | Savory Score</title>
    <link rel="stylesheet" href="rev.css" />
</head>

<body>
    <header>
        <h1>SAVORY SCORE</h1>
        <nav>
            <a href="home.html">&nbsp;HOME&nbsp; </a>|
            <a href="about.html">&nbsp;ABOUT&nbsp; </a>|
            <a href="menu.html">&nbsp;MENU &nbsp;</a>|
            <a href="review.html">&nbsp;REVIEW &nbsp;</a>|
            <a href="contact.html">&nbsp;CONTACT&nbsp;</a>|
            <a href="login.html">&nbsp;LOGOUT&nbsp;</a>
        </nav>

        <img src="icon.jpg" alt="User Profile" class="profile-pic">
    </header>
    <div class="regMain">
        <h1>Write a Review</h1>
        <form id="reviewForm" class="regForm">
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="text" name="restaurant" placeholder="Dish Name" required>
            <input type="number" name="rating" placeholder="Rating (1-5)" min="1" max="5" required>
            <textarea name="comment" placeholder="Your Review" required style="width: 300px; height: 150px;"></textarea>
            <button type="submit">Submit Review</button>
        </form>
        <div class="message" id="reviewMsg"></div>
    </div>

    <script>
        document.getElementById("reviewForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(e.target).entries());
            const res = await fetch("/review", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            document.getElementById("reviewMsg").textContent = result.message;
        });
    </script>
</body>

</html>
